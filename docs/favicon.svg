<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181513" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="31%" cy="25%" r="66%">
      <stop offset="0%" stop-color="#b87333" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#b87333" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a36e" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#b87333" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5e3815" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa" />
      <stop offset="100%" stop-color="#eae1d5" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eeb07a" />
      <stop offset="100%" stop-color="#b87333" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Bronze Border & Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#borderGrad)" />
  <rect x="30" y="30" width="452" height="452" rx="94" fill="url(#bgGrad)" />
  <rect x="30" y="30" width="452" height="452" rx="94" fill="url(#ambientGlow)" />

  <!-- Monogram YB. -->
  <g filter="url(#dropShadow)">
    <!-- Letter Y -->
    <path d="M 74 148 L 124 148 L 150 224 L 176 148 L 226 148 L 173 266 L 173 364 L 127 364 L 127 266 Z" fill="url(#textGrad)" />

    <!-- Letter B -->
    <path fill-rule="evenodd" d="M 238 148 L 308 148 A 55 55 0 0 1 348.8 240.0 A 59 59 0 0 1 314 364 L 238 364 Z M 282 185.5 L 305 185.5 A 18.5 18.5 0 0 1 305 222.5 L 282 222.5 Z M 282 282.5 L 311 282.5 A 21.5 21.5 0 0 1 311 325.5 L 282 325.5 Z" fill="url(#textGrad)" />

    <!-- Bronze Signature Period (.) -->
    <circle cx="416" cy="338" r="26" fill="url(#dotGrad)" />
  </g>
</svg>
